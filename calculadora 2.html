<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Precios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body>
  <div class="container mt-5" style="max-width: 600px;">
    <h2 class="text-center animate__animated animate__fadeInDown mb-4">💰 Calculadora de Precios</h2>
    <form id="priceForm">
      <div class="mb-3">
        <label for="cost" class="form-label">Costo base:</label>
        <input type="number" class="form-control" id="cost" required>
      </div>
      <div class="mb-3">
        <label for="margin" class="form-label">Margen de ganancia (%):</label>
        <input type="number" class="form-control" id="margin" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Calcular 📊</button>
    </form>
    <div id="result" class="mt-4 d-none text-center animate__animated">
      <h4>Resultado:</h4>
      <p>💸 Precio final: <span id="finalPrice"></span></p>
      <p>📈 Ganancia: <span id="profit"></span></p>
    </div>
  </div>

  <script>
    document.getElementById('priceForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const cost = parseFloat(document.getElementById('cost').value);
      const margin = parseFloat(document.getElementById('margin').value);

      if (isNaN(cost) || isNaN(margin)) {
        alert('Completa ambos campos correctamente.');
        return;
      }

      const finalPrice = cost + (cost * margin / 100);
      const profit = finalPrice - cost;

      document.getElementById('finalPrice').textContent = `$${finalPrice.toFixed(2)}`;
      document.getElementById('profit').textContent = `$${profit.toFixed(2)}`;

      const resultDiv = document.getElementById('result');
      resultDiv.classList.remove('d-none');
      resultDiv.classList.remove('animate__fadeIn');
      void resultDiv.offsetWidth;
      resultDiv.classList.add('animate__fadeIn');
    });
  </script>
</body>
</html>
